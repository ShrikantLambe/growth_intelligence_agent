[project]
name = "growth-intelligence-agent"
version = "1.0.0"
requires-python = ">=3.12"
# Vercel deployment dependencies — intentionally excludes:
#   sentence-transformers / faiss-cpu  → PyTorch is ~2 GB and blows the 500 MB Lambda limit
#   streamlit / plotly / faker         → UI and data-gen tools not needed at runtime
# The get_company_context RAG tool degrades gracefully when the vectorstore is unavailable.
# For full local development use requirements.txt instead.
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.15",
    "langchain-openai>=0.1.8",
    "langchain-community>=0.2.0",
    "langgraph>=0.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[tool.vercel]
entrypoint = "api/main.py"
