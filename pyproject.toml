[project]
name = "growth-intelligence-agent"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.25.0",
    "openai>=1.30.0",
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.15",
    "langchain-openai>=0.1.8",
    "langchain-community>=0.2.0",
    "langgraph>=0.2.0",
    "faiss-cpu>=1.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[tool.vercel]
entrypoint = "api/main.py"
